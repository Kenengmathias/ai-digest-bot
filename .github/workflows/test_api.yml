name: Test OpenRouter Keys

on:
  workflow_dispatch: # Allows you to trigger this manually from the Actions tab

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Execute Diagnostic Test
        env:
          # This maps your GitHub Repository Secret to the script's environment variable
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }} 
        run: python test_models.py

